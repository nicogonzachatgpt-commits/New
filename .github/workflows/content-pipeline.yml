name: Fetch and analyze reference videos
on:
  workflow_dispatch:
  push:
    branches: [claude/latam-marketing-creators-analysis-r905bf]
    paths: ['pipeline/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default,curl-cffi]" faster-whisper
      - name: Run pipeline
        run: python pipeline/fetch_analyze.py
      - name: Commit results back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pipeline_data
          git commit -m "Add fetched video data (frames, transcripts, metadata)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep 5
          done
          exit 1
