name: Discover channel video listings
on:
  workflow_dispatch:
  push:
    branches: [claude/latam-marketing-creators-analysis-r905bf]
    paths: ['pipeline/channels.txt']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: pip install -U "yt-dlp[default,curl-cffi]"
      - name: Run discovery
        run: python pipeline/discover.py
      - name: Commit results back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add -A pipeline_data/discovery
          git commit -m "Add channel discovery listings with view counts" || echo "nothing to commit"
          git push || true
